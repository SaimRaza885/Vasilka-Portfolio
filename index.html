<html lang="en" data-theme="light">

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#ffffff" />

    <meta name="twitter:card" content="summary" />

    <title>Vasilka Vlaykova | Computing, Data &amp; AI</title>
    <script>
      try {
        const saved = localStorage.getItem("theme");
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved : systemDark ? "dark" : "light";
        if (document.documentElement.dataset.theme === "dark") {
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#171513");
        }
      } catch { /* Keep the default light theme when storage is unavailable. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
